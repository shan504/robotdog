# Initial HTTP validation. Place in /etc/nginx/sites-available/robotdog.
server {
    listen 80;
    listen [::]:80;
    server_name robotdog.com;
    return 301 http://www.robotdog.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.robotdog.com;
    root /var/www/robotdog;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 7d; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
