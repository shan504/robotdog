# RobotDog managed site: robotdogcxy.xyz
# Install at /etc/nginx/sites-available/robotdogcxy. Certbot may add HTTPS here.
server {
    listen 80;
    listen [::]:80;
    server_name robotdogcxy.xyz;
    root /var/www/robotdogcxy/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 7d; }
    location = /sitemap.xml { types { } default_type application/xml; }
    location = /robots.txt { default_type text/plain; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
