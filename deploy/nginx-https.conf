# Use after installing a valid certificate covering robotdog.com AND www.robotdog.com.
server {
    listen 80;
    listen [::]:80;
    server_name robotdog.com www.robotdog.com;
    return 301 https://www.robotdog.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name robotdog.com;
    ssl_certificate /etc/nginx/ssl/robotdog/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/robotdog/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.robotdog.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.robotdog.com;
    ssl_certificate /etc/nginx/ssl/robotdog/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/robotdog/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/robotdog;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 7d; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
