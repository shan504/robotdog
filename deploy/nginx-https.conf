# RobotDog managed site: robotdogcxy.xyz
# Alternative manual template, only after obtaining this domain's certificate.
server {
    listen 80;
    listen [::]:80;
    server_name robotdogcxy.xyz;
    return 301 https://robotdogcxy.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name robotdogcxy.xyz;
    ssl_certificate /etc/letsencrypt/live/robotdogcxy.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robotdogcxy.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/robotdogcxy/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 7d; }
    location = /sitemap.xml { types { } default_type application/xml; }
    location = /robots.txt { default_type text/plain; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
