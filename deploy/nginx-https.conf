# RobotCar managed site: __ROBOTCAR_DOMAIN__
# Install only after obtaining a certificate covering both hostnames.
server {
    listen 80;
    listen [::]:80;
    server_name __ROBOTCAR_DOMAIN__ www.__ROBOTCAR_DOMAIN__;
    return 301 https://__ROBOTCAR_DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.__ROBOTCAR_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__ROBOTCAR_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ROBOTCAR_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://__ROBOTCAR_DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __ROBOTCAR_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__ROBOTCAR_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ROBOTCAR_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/robotcar/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 7d; }
    location = /sitemap.xml { types { } default_type application/xml; }
    location = /robots.txt { default_type text/plain; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
