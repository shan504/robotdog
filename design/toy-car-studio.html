<!doctype html><html><head><meta charset="utf-8"><title>RobotCar original product rendering studio</title><style>html,body{margin:0;background:transparent}canvas{display:block;width:1000px;height:850px}</style><script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script></head><body><script type="module">
import * as THREE from 'three';

const material=(color,metal=.25,rough=.35)=>new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough});
const black=material(0x111927,.2,.6),rubber=material(0x151922,0,.8),silver=material(0xced7e0,.7,.3),glass=material(0x172c45,.45,.16),white=material(0xeff3fa,.15,.3),blue=material(0x1875ed,.5,.24),orange=material(0xf28a29,.3,.25),green=material(0x2b8870,.3,.45);

function mesh(geo,mat,x=0,y=0,z=0,parent=root){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(w,h,d,mat,x=0,y=0,z=0,r=.1,parent=root){return mesh(new RoundedBoxGeometry(w,h,d,4,r),mat,x,y,z,parent);}

function bar(a,b,r,mat){const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),dir=end.clone().sub(start);const m=mesh(new THREE.CylinderGeometry(r,r,dir.length(),16),mat);m.position.copy(start.add(end).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());return m;}
function wheel(x,z,r=.48,mecanum=false){const g=new THREE.Group();g.position.set(x,r,z);root.add(g);const tire=cyl(r,.34,rubber,0,0,0,g);tire.rotation.x=Math.PI/2;const rim=cyl(r*.63,.36,silver,0,0,0,g);rim.rotation.x=Math.PI/2;const inset=cyl(r*.44,.38,black,0,0,0,g);inset.rotation.x=Math.PI/2;const hub=cyl(r*.2,.41,blue,0,0,0,g);hub.rotation.x=Math.PI/2;
